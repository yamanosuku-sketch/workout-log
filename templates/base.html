<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    {% block extra_head %}{% endblock %}

    <style>
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <div class="demo-notice">
        <strong>共有デモ版です</strong>
        <span>
            入力・編集・削除した内容は、ほかの利用者にも表示されます。
            個人情報や実際の健康情報は入力しないでください。
        </span>
    </div>
    {% block content %}{% endblock %}
    
    {% if active_page == 'index' or active_page == 'graph' %}
    <div class="bottom-nav">
        <a href="/" class="{% if active_page =='index' %}active{% endif %}">記録</a>
        <a href="/graph" class="{% if active_page == 'graph' %}active{% endif %}">グラフ</a>
    </div>
    {% endif %}

    {% block script %}{% endblock %}
</body>
</html>
